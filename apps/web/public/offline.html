<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#faf8f3" />
    <meta name="robots" content="noindex" />
    <title>Offline - Vardenia</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #faf8f3;
        color: #111d2d;
        font-family: Georgia, 'Times New Roman', serif;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      main { max-width: 28rem; }
      .mark { letter-spacing: 0.3em; font-size: 0.85rem; margin-bottom: 2rem; }
      h1 { font-weight: 500; font-size: 1.6rem; margin: 0 0 0.75rem; }
      p { margin: 0 0 1.5rem; line-height: 1.5; color: #4a5160; }
      [lang='ar'] { font-family: Tahoma, Arial, sans-serif; }
      button {
        font: inherit;
        background: #111d2d;
        color: #faf8f3;
        border: 0;
        padding: 0.7rem 1.4rem;
        cursor: pointer;
      }
      @media (min-width: 1051px) {
        body[data-english-recovery] main { width: min(920px, 86vw); max-width: none; text-align: start; display: grid; grid-template-columns: 1.2fr .8fr; align-items: start; gap: 16px 7%; padding-block: 30px; border-block: 1px solid #c7ae7c; }
        body[data-english-recovery] .mark { grid-column: 1/-1; margin: 0 0 22px; font-size: 22px; }
        body[data-english-recovery] main > h1 { font-size: clamp(54px, 5.4vw, 84px); line-height: 1.03; letter-spacing: -.04em; margin: 0; }
        body[data-english-recovery] main > p { grid-column: 1; font: 17px/1.65 system-ui,sans-serif; margin: 0; }
        body[data-english-recovery] [lang='ar'] { grid-column: 2; grid-row: 2 / span 2; align-self: center; }
        body[data-english-recovery] button { grid-column: 1; justify-self: start; border-radius: 6px; font: 500 15px/1.5 system-ui,sans-serif; }
      }
    </style>
  </head>
  <body>
    <script>
      // A service worker serves this document at the address the visitor requested.
      if (!['ar','fr','es','pt','ru','zh','hi','bn','ur'].includes(location.pathname.split('/')[1])) {
        document.body.setAttribute('data-english-recovery', '')
      }
    </script>
    <main>
      <div class="mark">VARDENIA</div>
      <h1>You are offline</h1>
      <p>This page needs a connection. Check your signal or Wi-Fi, then try again.</p>
      <div lang="ar" dir="rtl">
        <h1>أنت غير متصل بالإنترنت</h1>
        <p>تحتاج هذه الصفحة إلى اتصال. تحقّق من الشبكة أو الواي فاي، ثم حاول مجدداً.</p>
      </div>
      <button type="button" onclick="location.reload()">Try again · حاول مجدداً</button>
    </main>
  </body>
</html>
