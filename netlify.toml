# Netlify build configuration.
#
# The site is a pnpm workspace with Turborepo, so the build runs from the repo
# root rather than from apps/web: @vardenia/web depends on five workspace
# packages by source (see transpilePackages in next.config.mjs), and a build
# scoped to apps/web alone cannot see them.
#
# `--filter=@vardenia/web` keeps the mobile app out of the deploy. Turbo still
# builds the packages web depends on first, because the build task declares
# dependsOn: ["^build"].

[build]
  # Two commands, and the order matters.
  #
  # src/payload-types.ts is generated from the collection definitions and is
  # deliberately not committed - a stale checked-in type file is worse than
  # none, because it disagrees with the schema silently. CI generates it before
  # typechecking; this build has to do the same, or every collection resolves to
  # `JsonObject & TypeWithID` and `next build` fails on the first place a real
  # field is read.
  #
  # NODE_ENV is set inline on that first command rather than in
  # [build.environment], and both halves of that are deliberate:
  #
  #  - It must be set, because payload.config has `push: NODE_ENV !==
  #    'production'`. Left unset, generating types would initialise Payload with
  #    push enabled against DATABASE_URL, which here is production, and sync the
  #    schema on connect. Migrations exist precisely so that never happens.
  #  - It must NOT be global, because Netlify runs `pnpm install` before this
  #    command, and a production NODE_ENV would have it skip devDependencies -
  #    taking turbo and typescript with them.
  #
  # `next build` sets NODE_ENV=production itself, so the second command is
  # already safe.
  command = "NODE_ENV=production pnpm --filter @vardenia/web generate:types && pnpm turbo run build --filter=@vardenia/web"
  publish = "apps/web/.next"

[build.environment]
  # Matches engines (>=20.9.0) and the version CI runs on, so a build that
  # passes in Actions is running the same runtime here.
  #
  # pnpm needs no setting: Netlify picks it up from pnpm-lock.yaml, and the
  # version comes from packageManager (pnpm@9.15.0) in the root package.json.
  NODE_VERSION = "22"

# Next.js support: routing, ISR, image optimisation and the server components
# that Payload's admin panel is built from. Without this the output in
# apps/web/.next is served as static files and every dynamic route 404s.
[[plugins]]
  package = "@netlify/plugin-nextjs"
