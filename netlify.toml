# Netlify build configuration.
#
# The site is a pnpm workspace with Turborepo, so the build runs from the repo
# root rather than from apps/web: @vardenia/web depends on five workspace
# packages by source (see transpilePackages in next.config.mjs), and a build
# scoped to apps/web alone cannot see them.
#
# `--filter=@vardenia/web` keeps the mobile app out of the deploy. Turbo still
# builds the packages web depends on first, because the build task declares
# dependsOn: ["^build"].

[build]
  # Two commands, and the order matters.
  #
  # src/payload-types.ts is generated from the collection definitions and is
  # deliberately not committed - a stale checked-in type file is worse than
  # none, because it disagrees with the schema silently. CI generates it before
  # typechecking; this build has to do the same, or every collection resolves to
  # `JsonObject & TypeWithID` and `next build` fails on the first place a real
  # field is read.
  #
  # NODE_ENV is set inline on that first command rather than in
  # [build.environment], and both halves of that are deliberate:
  #
  #  - It must be set, because payload.config has `push: NODE_ENV !==
  #    'production'`. Left unset, generating types would initialise Payload with
  #    push enabled against DATABASE_URL, which here is production, and sync the
  #    schema on connect. Migrations exist precisely so that never happens.
  #  - It must NOT be global, because Netlify runs `pnpm install` before this
  #    command, and a production NODE_ENV would have it skip devDependencies -
  #    taking turbo and typescript with them.
  #
  # `next build` sets NODE_ENV=production itself, so the second command is
  # already safe.
  command = "NODE_ENV=production pnpm --filter @vardenia/web generate:types && pnpm turbo run build --filter=@vardenia/web"
  publish = "apps/web/.next"

[build.environment]
  # Matches engines (>=20.9.0) and the version CI runs on, so a build that
  # passes in Actions is running the same runtime here.
  #
  # pnpm needs no setting: Netlify picks it up from pnpm-lock.yaml, and the
  # version comes from packageManager (pnpm@9.15.0) in the root package.json.
  NODE_VERSION = "22"

# Run the functions next to the database.
#
# Supabase is in eu-central-1 (Frankfurt) - the connection string says
# aws-0-eu-central-1.pooler.supabase.com. Netlify defaults to us-east-1, so
# every dynamic page opened its connection across the Atlantic and paid that
# round trip on each query. A listing page makes two of them.
#
# It is also closer to the readers. Lebanon to Frankfurt is a short hop; Lebanon
# to Virginia and back on every uncached request is not.
#
# Region selection needs a Netlify Core Pro plan or above. On a lower plan the
# setting is ignored rather than failing the build - so if the improvement does
# not appear, check the plan before looking for a bug.
#
# # It was ignored for two separate reasons. Measured 26 and 28 August 2026.
#
# The plan is one of them, below. The other is that the value said
# "eu-central-1", which this key does not accept - it takes airport codes, and
# an unrecognised one is not an error, just nothing. Either fault alone produces
# the same symptom, so fixing the plan without fixing the value would have
# looked like the plan making no difference.
#
# Two paths through the same force-dynamic function, so edge distance cancels:
# /g/ZZZ returns before it ever calls getPayload, and /g/<seven valid chars>
# costs exactly one uncached lookup. The difference was ~217ms. A laptop in
# Lebanon querying the same database over the same pooler gets 62ms.
#
# Being three times further from Frankfurt than Beirut is means us-east-1, which
# is the default. So this line is doing nothing on the current plan.
#
# What it costs, beyond a slower page:
#
#   - Payload's admin panel deletes and updates one document at a time so that
#     hooks and access run per row. At this latency that is roughly a second per
#     row, so any bulk action over about ten rows exceeds Netlify's 10s function
#     timeout and surfaces as "An unknown error has occurred".
#   - Every uncached dynamic request pays it. A listing page makes two queries.
#   - A QR scan pays it on a cache miss, before the reader goes anywhere.
#
# Moving the database to us-east-1 would fix the latency and is the wrong fix:
# Frankfurt is deliberate, both for readers in Lebanon and for the EU hosting
# position the privacy policy rests on.
[functions]
  # Frankfurt. `fra` is an airport code, and that is the only form this key
  # accepts - the AWS name `eu-central-1` sat here for two days and was never a
  # valid value. On the free plan it was ignored either way, so nothing revealed
  # it; on Pro it would have looked exactly like the plan not applying the
  # setting. Netlify's self-serve list is cmh, dub, fra, gru, iad, lhr, nrt,
  # pdx, sfo, sin, syd, yul.
  #
  # Also set the same region in the UI under Project configuration > Build &
  # deploy > Functions region. That is the documented site-level control; this
  # key is documented per function. Both pointing at Frankfurt means whichever
  # one the platform honours gives the same answer.
  region = "fra"

# Next.js support: routing, ISR, image optimisation and the server components
# that Payload's admin panel is built from. Without this the output in
# apps/web/.next is served as static files and every dynamic route 404s.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# How long a browser may keep an optimised image.
#
# `images.minimumCacheTTL` in next.config.ts is set to a year and does nothing
# here. The plugin above rewrites `/_next/image` onto Netlify's own Image CDN,
# which applies its own policy and ignores Next's - measured on the live site:
#
#   /_next/image    Cache-Control: max-age=14400          (4 hours)
#   /_next/static   Cache-Control: max-age=31536000, immutable
#
# Four hours means every returning reader refetches every photograph on the
# directory several times a week. That is the bandwidth and web-request line on
# the Netlify bill, and it is the largest single thing on it.
#
# # Thirty days, not a year, and the reason is `public/images`
#
# The listing photographs are safe to cache forever: their filenames carry a
# content hash (`3ind-judy-cover-b6fb339cefba6bcef5e6cd1d-900x1200.webp`), so a
# replaced photograph is a different URL. The ten files in `public/images` are
# not - `hero.jpg` stays `hero.jpg`. A year would pin a replaced hero in every
# returning reader's browser until 2027, with no way to reach them.
#
# Thirty days is still 180 times fewer revalidations than four hours, and a
# design change propagates within a month. Make it a year once those ten files
# are content-addressed too - importing them from `src` rather than serving them
# from `public` is what does that.
#
# `stale-while-revalidate` lets the browser paint the old file immediately and
# fetch the new one behind it, so the day the cache does expire costs nobody a
# blank masthead.
[[headers]]
  for = "/_next/image*"

  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"
