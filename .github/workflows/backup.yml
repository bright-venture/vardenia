name: Back up the permanence layer

# The one irreplaceable thing in the database is the map from a printed code to
# what it opens: that code was minted once and is now on paper. The free Supabase
# plan takes no backups, so this makes one every night - the codes and their
# target slugs, all of it public data, committed to the repo. Git is the history:
# offsite from Supabase, versioned, and diffable, which matters because a code is
# not meant to change what it points at on its own, so a line moving in that file
# is an alarm. See apps/web/src/backup/permanence.ts and backups/README.md.
#
# Personal data (bookings, customers) is deliberately not here. It waits for
# Supabase's own backups once there is anything worth losing.
#
# # Each credential reaches only the step that needs it
#
# This job holds two things worth stealing: production's connection string and a
# token that can push to the repository. `pnpm install` runs the install scripts
# of a few hundred packages, so anything in the job's environment, or left in the
# checkout's git config, is readable by all of them. So the database URL is set
# on the export step alone, the checkout does not keep its token, and the push
# hands the token to git for that one command. Third-party actions are pinned to
# a commit, not a tag a compromised maintainer could move.

on:
  schedule:
    # 03:17 UTC daily. Off-peak, and an odd minute so it does not pile onto the
    # top of the hour with everyone else's cron.
    - cron: '17 3 * * *'
  # So it can be run by hand from the Actions tab, for a snapshot on demand.
  workflow_dispatch: {}

concurrency:
  # Never let two exports race to commit the same file.
  group: backup-permanence
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      # The only thing this job does is commit the backup file.
      contents: write

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Do not leave the push token in .git/config for every install script
          # to read. The commit step below supplies it for the push alone.
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Exits non-zero, and writes nothing, if any printed code no longer
      # resolves. A failed run here is the alarm, not a nuisance: it means a code
      # on paper has stopped pointing anywhere.
      - name: Export
        env:
          # Read-only use, so the transaction pooler is fine. Set this repository
          # secret to production's connection string, ideally for a role that can
          # only read. The export talks to Postgres directly and never boots
          # Payload. Scoped to this step, so no other step can see it.
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          # Supabase's CA, so the connection is verified as well as encrypted
          # (lib/db-ssl). Unset, it still encrypts but trusts any certificate.
          DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
        run: pnpm --filter @vardenia/web backup:export

      - name: Commit if the layer changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add backups/qr-permanence.json
          # --cached, so a brand-new file (the very first snapshot) counts as a
          # change too; a plain `git diff` only sees tracked files and would skip it.
          if git diff --cached --quiet; then
            echo "No change since the last snapshot."
            exit 0
          fi
          git config user.name "vardenia-backup"
          git config user.email "backup@users.noreply.github.com"
          git commit -m "Back up the QR permanence layer"
          # The token for this one push, never written to the git config.
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
