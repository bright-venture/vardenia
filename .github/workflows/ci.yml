name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: vardenia
          POSTGRES_PASSWORD: vardenia
          POSTGRES_DB: vardenia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vardenia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://vardenia:vardenia@localhost:5432/vardenia_test
      PAYLOAD_SECRET: ci-only-not-a-real-secret
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      # payload-types.ts is generated, not committed - the schema is the source
      # of truth, and a stale checked-in type file is worse than none.
      - name: Generate Payload types
        run: pnpm --filter @vardenia/web generate:types

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Runs before the build on purpose: the suite takes seconds and the build
      # takes minutes, so a broken slug generator or QR encoder should fail here
      # rather than after a full Next compile.
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
